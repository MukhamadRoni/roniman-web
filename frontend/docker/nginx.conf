# Serves the React build and forwards the Laravel routes (/api, /up) to PHP-FPM in the `app` container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Real visitor IP when another reverse proxy (Caddy, Traefik, a host nginx) sits in front.
    # The contact form rate limit is per IP, so this matters. Only private ranges are trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Laravel: every API request goes through public/index.php.
    location ~ ^/(api/|up$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Resolved per request through Docker DNS, so a restarted app container (new IP) is found again.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 60s;
    }

    # Hashed Vite bundles never change.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Topline page media (video, posters, icons).
    location /topline/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA: /id, /en, /id/projects/topline, ... all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
